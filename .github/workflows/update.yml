# データの自動取得 → GitHub Pages へ公開
# 時刻は日本時間（cron は世界標準時で書いています）。GitHubの混雑で数分〜数十分遅れることがあります。
name: データ更新と公開

on:
  schedule:
    - cron: "37 21 * * 0-4"   # 月〜金 06:37
    - cron: "52 0 * * 1-5"    # 月〜金 09:52（日本国債は9:30ごろ公表）
    - cron: "17 23 * * 5"     # 土    08:17（CFTCは金曜夜に公表）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: データ取得
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node portal-update.mjs

      - name: 取得したデータを保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "データに変更はありません"
          else
            git commit -m "データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
